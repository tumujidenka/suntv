<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- <link rel="icon" href="./asset/media/logo.png"> -->

    <!-- フォント読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- css読み込み -->
    <link rel="stylesheet" href="./assets/css/destyle.css">
    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- JSライブラリ読み込み -->
    <title>サンテレビドローンキャンプ場</title>
</head>
<body>
    <div class="container">
        <!-- 左カラム -->
        <nav class="side-nav">
            <div class="side-nav__content">
                <div class="side-nav__header">
                    <div class="side-nav__logo">
                        <div class="side-nav__logo-image">
                            <img src="./assets/media/logo.png" alt="suntv-logo">
                        </div>
                        <p class="side-nav__logo-text">サンテレビ</p>
                    </div>
                    <div class="side-nav__title">
                        ドローンキャンプ
                    </div>    
                </div>
                <div class="side-nav__menu">
                    <ul class="side-nav__menu-list">
                        <li class="side-nav__menu-item">
                            <a href="#">
                                <h3 class="side-nav__menu-title">Strengths & Features</h3>
                                <p class="side-nav__menu-description">強みと特徴</p>    
                            </a>
                        </li>
                        <li class="side-nav__menu-item">
                            <a href="#">
                                <h3 class="side-nav__menu-title">Courses & Prices</h3>
                                <p class="side-nav__menu-description">コースと料金</p>
                            </a>
                        </li>
                        <li class="side-nav__menu-item">
                            <a href="#">
                                <h3 class="side-nav__menu-title">FAQ</h3>
                                <p class="side-nav__menu-description">よくあるご質問</p>
                            </a>
                        </li>
                        <li class="side-nav__menu-item">
                            <a href="#">
                                <h3 class="side-nav__menu-title">Contact Us</h3>
                                <p class="side-nav__menu-description">お問い合わせ</p>
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="side-nav__image">
                    <img src="./assets/media/drone-image.png" alt="drone-image">
                </div>    
            </div>
        </nav>
        <!-- ハンバーガーメニューボタン -->
        <div class="hamburger-menu">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <!-- 右カラム -->
        <main class="main-content">
            <!-- ファーストビュー -->
            <section class="first-view">
                <div class="first-view__header">
                    <div class="first-view__header-sub">
                        <div class="first-view__header-sub frame">
                            <h2 class="first-view__header-sub--subtitle subtitle-1">新<span>たな</span>キャリア<span>を</span></h2>
                            <h2 class="first-view__header-sub--subtitle subtitle-2">切り拓く!</h2>    
                        </div>
                    </div>
                    <div class="first-view__header-main">
                        <h1 class="first-view__header-title">SUN TV<br>Drone Camp</h1>
                    </div>
                </div>
                <div class="first-view__content">
                    <div class="first-view__content-features">
                        <div class="first-view__content-feature licence">
                            <p class="first-view__content-feature-text">二等国家ライセンス<br><span>取得</span></p>
                        </div>    
                        <div class="first-view__content-feature skill">
                            <p class="first-view__content-feature-text">空撮スキル<br><span>習得</span></p>
                        </div>
                    </div>
                    <div class="first-view__content-cta">
                        <a href="#" class="first-view__content-cta-link">お申し込みはこちら</a>
                    </div>
                </div>
            </section>

        </main>
    </div>


    <script src="assets/js/main.js"></script>
</body>
</html>
